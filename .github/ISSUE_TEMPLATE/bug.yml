name: Bug
description: Something is broken or looks wrong
labels: [bug]
body:
  - type: input
    id: page
    attributes: { label: Page or screen, placeholder: "/study/class11-bio-ch01" }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce, description: "What did you press, in order?" }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What you expected and what happened }
    validations: { required: true }
  - type: input
    id: env
    attributes: { label: Device, browser, theme, language, placeholder: "Pixel 6, Chrome, dark, English" }
  - type: textarea
    id: spec
    attributes: { label: Which walkthrough/spec line does this contradict? (if any) }
